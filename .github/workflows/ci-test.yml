name: Test
on:
  push:
  pull_request:
    branches: [main]
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: npm ci
      - name: Test code
        run: npm test
      # Skipped by npm test above (see cts2c/cts2c-parity.spec.ts); run it here with
      # CTS2C_PARITY set. Transpiles src/ to C, compiles it with the runner's gcc, and
      # checks the C build's execution trace still matches Node's for 5M cycles on each
      # architecture. Kept as its own step so a parity failure is distinguishable from a
      # unit-test failure at a glance.
      - name: cts2c Node-vs-C parity
        run: npx vitest run cts2c
        env:
          CTS2C_PARITY: '1'
