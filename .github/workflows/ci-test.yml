name: Test
on:
  push:
  pull_request:
    branches: [main]
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # For the rolling release step below; the rest of the job only needs read access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: npm ci
      - name: Test code
        run: npm test
      # Skipped by npm test above (see cts2c/cts2c-parity.spec.ts); run it here with
      # CTS2C_PARITY set. Transpiles src/ to C, compiles it with the runner's gcc, and
      # checks the C build's execution trace still matches Node's for 5M cycles on each
      # chip/architecture (RISC-V, ARM, and RP2040). Kept as its own step so a parity
      # failure is distinguishable from a unit-test failure at a glance.
      - name: cts2c Node-vs-C parity
        run: npx vitest run cts2c
        env:
          CTS2C_PARITY: '1'
      # Publishes the transpiled emulator and its example driver, so the C build can be
      # used without a Node toolchain. Last step in the job, so nothing is published
      # unless the tests and the parity check above passed; cts2c:full also exits non-zero
      # on any gcc error, so a header that does not compile is never released.
      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run cts2c:full
          # Recreated rather than edited in place so the `rolling` tag always points at the
          # commit the published files were generated from. The download URLs are fixed:
          # .../releases/download/rolling/<file>
          gh release delete rolling --cleanup-tag --yes || true
          gh release create rolling \
            --target "$GITHUB_SHA" \
            --title 'rp2350js-c (rolling)' \
            --notes "Transpiled C build of rp2350js, generated from $GITHUB_SHA." \
            --prerelease \
            build/transpile/rp2350js-c.h \
            demo/emulator-run.c
